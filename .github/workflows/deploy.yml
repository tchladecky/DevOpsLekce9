name: Build, Test & Deploy (ECR + ECS)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION:   us-east-1
  TF_VERSION:   1.9.0
  PROJECT_NAME: ecs-nginx-demo

jobs:
  # ============================================================
  # JOB 1 – Build Docker image a push do ECR
  # ============================================================
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    environment: devops

    permissions:
      contents: read
      id-token: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      ecr_url:   ${{ steps.ecr_url.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=${SHA}" >> $GITHUB_OUTPUT

      - name: Get ECR URL
        id: ecr_url
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          URL="${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.PROJECT_NAME }}"
          echo "url=${URL}" >> $GITHUB_OUTPUT

      - name: Build & Push Docker image
        run: |
          ECR="${{ steps.ecr_url.outputs.url }}"
          TAG="${{ steps.meta.outputs.tag }}"
          docker build --tag "${ECR}:${TAG}" --tag "${ECR}:latest" .
          docker push "${ECR}:${TAG}"
          docker push "${ECR}:latest"
          echo "✅ Pushed ${ECR}:${TAG} and ${ECR}:latest"

  # ============================================================
  # JOB 2 – Lokální test (Docker spuštěný přímo v GitHub runneru)
  # Běží na každém push/PR – PŘED deploymentem
  # ============================================================
  test-local:
    name: Local Docker Test
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      # Spustíme kontejner lokálně v runneru (bez ECR, z lokálního buildu)
      - name: Build Docker image locally
        run: docker build --tag nginx-local-test .

      - name: Start nginx container
        run: |
          docker run -d \
            --name nginx-test \
            -p 8080:80 \
            nginx-local-test
          echo "Čekám než nginx nastartuje..."
          sleep 3

      - name: Verify container is running
        run: docker ps | grep nginx-test

      # Spustíme pytest proti localhost:8080
      - name: Run pytest (local)
        env:
          BASE_URL: http://localhost:8080
        run: pytest tests/ -v --html=test-report-local.html --self-contained-html

      # Report se uloží jako artifact i při selhání
      - name: Upload test report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-report-local
          path: test-report-local.html

      - name: Stop nginx container
        if: always()
        run: docker stop nginx-test && docker rm nginx-test

  # ============================================================
  # JOB 3 – Terraform deploy + live test proti ALB
  # Pouze push do main, závisí na úspěšném testu
  # ============================================================
  terraform:
    name: Terraform Deploy & Live Test
    runs-on: ubuntu-latest
    needs: [docker, test-local]          # spustí se jen pokud oba předchozí joby prošly
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: devops

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Import ECR repository if exists
        run: terraform import aws_ecr_repository.nginx ${{ env.PROJECT_NAME }} || true

      - name: Terraform Apply
        run: |
          terraform apply \
            -auto-approve \
            -input=false \
            -var="image_tag=${{ needs.docker.outputs.image_tag }}"

      - name: Show deployment summary
        run: |
          echo "### 🚀 Deployment dokončen" >> $GITHUB_STEP_SUMMARY
          echo "| Output | Hodnota |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| ALB URL | $(terraform output -raw load_balancer_url) |" >> $GITHUB_STEP_SUMMARY
          echo "| ECR URL | $(terraform output -raw ecr_repository_url) |" >> $GITHUB_STEP_SUMMARY
          echo "| Image tag | ${{ needs.docker.outputs.image_tag }} |" >> $GITHUB_STEP_SUMMARY

      # Čekáme než ECS task nastartuje a ALB health check projde
      - name: Wait for ECS to stabilize
        run: |
          echo "Čekám 90 s než ECS service nastartuje..."
          sleep 90

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      # Live pytest test proti skutečnému ALB
      - name: Run pytest (live ALB)
        env:
          BASE_URL: ${{ steps.alb_url.outputs.url }}
        run: |
          ALB_URL=$(terraform output -raw load_balancer_url)
          echo "Testuji live URL: $ALB_URL"
          BASE_URL=$ALB_URL pytest tests/ -v --html=test-report-live.html --self-contained-html

      - name: Upload live test report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-report-live
          path: test-report-live.html
